<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="description" content="NEPTUN Mobile for ELTE — unofficial ELTE Neptun client by Nanda. Install guides for Windows, macOS, and iPhone.">
  <meta name="theme-color" content="#e11d48">
  <title>NEPTUN Mobile for ELTE — Install</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    :root {
      --bg-dark: #0a0a0b;
      --card-bg: rgba(20, 20, 22, 0.82);
      --card-border: rgba(255, 255, 255, 0.1);
      --card-shadow: 0 30px 80px -15px rgba(0, 0, 0, 0.8), 0 0 45px -10px rgba(225, 29, 72, 0.16);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-yellow: #e11d48;
      --accent-orange: #dc2626;
      --btn-active-bg: rgba(225, 29, 72, 0.18);
      --btn-active-border: rgba(225, 29, 72, 0.55);
    }

    html, body {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg-dark);
      color: var(--text-main);
      overflow-x: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 1.2rem 1rem 3.5rem;
      position: relative;
    }

    .background-container {
      position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 0;
    }
    .glow-orb {
      position: absolute; border-radius: 50%; filter: blur(95px); opacity: 0.32;
      animation: orbFloat 22s ease-in-out infinite alternate;
    }
    .orb-1 {
      width: 480px; height: 480px;
      background: radial-gradient(circle, #e11d48, #9f1239 70%);
      top: -12%; left: 10%; animation-duration: 24s;
    }
    .orb-2 {
      width: 520px; height: 520px;
      background: radial-gradient(circle, #dc2626, #450a0a 70%);
      bottom: -15%; right: 5%; animation-duration: 28s; animation-delay: -6s; opacity: 0.22;
    }
    .orb-3 {
      width: 380px; height: 380px;
      background: radial-gradient(circle, #fb7185, #7f1d1d 70%);
      top: 38%; right: 22%; animation-duration: 20s; animation-delay: -11s; opacity: 0.18;
    }
    .noise-overlay {
      position: absolute; inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 0);
      background-size: 26px 26px; opacity: 0.6;
    }
    @keyframes orbFloat {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(45px, -55px) scale(1.08); }
      100% { transform: translate(-40px, 40px) scale(0.92); }
    }

    .page-wrap {
      position: relative; z-index: 2;
      width: 100%; max-width: 820px; margin: 0 auto;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; margin-bottom: 14px; flex-wrap: wrap;
    }

    .back-link, .dev-link {
      display: inline-flex; align-items: center; gap: 7px;
      background: rgba(18, 22, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: #e2e8f0; font-size: 0.82rem; font-weight: 600;
      padding: 7px 15px; border-radius: 999px; text-decoration: none;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .back-link:hover, .dev-link:hover {
      transform: translateY(-2px);
      border-color: rgba(225, 29, 72, 0.45);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 20px rgba(225, 29, 72, 0.2);
    }
    .back-link strong, .dev-link strong { color: var(--accent-yellow); }

    .lang-switcher {
      display: inline-flex; background: rgba(0, 0, 0, 0.4);
      padding: 3px; border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08); gap: 3px;
    }
    .lang-btn {
      background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-family: inherit; font-size: 0.78rem;
      font-weight: 700; padding: 5px 10px; border-radius: 8px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .lang-btn:hover:not(.active) { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .lang-btn.active {
      background: var(--btn-active-bg); border-color: var(--btn-active-border);
      color: var(--accent-yellow); box-shadow: 0 2px 10px rgba(225, 29, 72, 0.18);
    }

    .card {
      position: relative; width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(28px) saturate(175%);
      -webkit-backdrop-filter: blur(28px) saturate(175%);
      border: 1px solid var(--card-border);
      border-radius: 30px; padding: 28px 26px 32px;
      box-shadow: var(--card-shadow);
    }
    .card::before {
      content: ''; position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.45), transparent);
      pointer-events: none;
    }

    .hero-badge {
      display: inline-flex; align-items: center; gap: 7px;
      font-size: 0.72rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: #cbd5e1;
      background: rgba(255, 255, 255, 0.05); padding: 6px 14px;
      border-radius: 999px; border: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 14px;
    }
    .hero-badge .dot {
      width: 7px; height: 7px; border-radius: 50%; background: #10b981;
      box-shadow: 0 0 10px #10b981;
    }

    h1 {
      font-size: clamp(1.45rem, 3.5vw, 2rem); font-weight: 800;
      letter-spacing: -0.02em; line-height: 1.2; margin-bottom: 10px;
    }
    h1 span { color: var(--accent-yellow); }
    .lede {
      color: var(--text-muted); font-size: 0.98rem; line-height: 1.65;
      margin-bottom: 18px; max-width: 62ch;
    }

    .action-row {
      display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 22px;
    }
    .btn-primary, .btn-ghost {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      font-family: inherit; font-size: 0.88rem; font-weight: 700;
      padding: 11px 18px; border-radius: 999px; text-decoration: none;
      cursor: pointer; border: 1px solid transparent; transition: all 0.2s ease;
    }
    .btn-primary {
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.95), rgba(220, 38, 38, 0.9));
      color: #111827; border-color: rgba(225, 29, 72, 0.55);
      box-shadow: 0 8px 24px rgba(220, 38, 38, 0.25);
    }
    .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.05); }
    .btn-ghost {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.12); color: #e2e8f0;
    }
    .btn-ghost:hover {
      border-color: rgba(225, 29, 72, 0.4); color: var(--accent-yellow);
    }

    .notice {
      background: rgba(225, 29, 72, 0.08);
      border: 1px solid rgba(225, 29, 72, 0.28);
      border-radius: 16px; padding: 14px 16px;
      color: #fde68a; font-size: 0.9rem; line-height: 1.55;
      margin-bottom: 22px;
    }
    .notice strong { color: var(--accent-yellow); }

    .platform-tabs {
      display: flex; flex-wrap: wrap; gap: 8px;
      margin-bottom: 18px;
      padding: 4px; background: rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 16px;
    }
    .tab-btn {
      flex: 1 1 140px; min-width: 120px;
      background: transparent; border: 1px solid transparent;
      color: var(--text-muted); font-family: inherit; font-size: 0.84rem;
      font-weight: 700; padding: 10px 12px; border-radius: 12px; cursor: pointer;
      transition: all 0.2s ease;
    }
    .tab-btn:hover:not(.active) { color: var(--text-main); background: rgba(255, 255, 255, 0.05); }
    .tab-btn.active {
      background: var(--btn-active-bg); border-color: var(--btn-active-border);
      color: var(--accent-yellow); box-shadow: 0 2px 10px rgba(225, 29, 72, 0.18);
    }

    .panel { display: none; }
    .panel.active { display: block; animation: fadeIn 0.25s ease; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: none; }
    }

    h2 {
      font-size: 1.15rem; font-weight: 800; margin: 8px 0 12px;
      color: var(--accent-yellow);
    }
    h3 {
      font-size: 0.98rem; font-weight: 700; margin: 18px 0 8px; color: #e2e8f0;
    }
    p, li {
      color: var(--text-muted); font-size: 0.92rem; line-height: 1.65;
    }
    p { margin-bottom: 10px; }
    ul, ol { margin: 0 0 12px 1.15rem; }
    li { margin-bottom: 6px; }
    li strong, p strong { color: #e2e8f0; font-weight: 700; }
    a.inline {
      color: var(--accent-yellow); text-decoration: underline;
      text-underline-offset: 2px;
    }
    a.inline:hover { color: #ffe08a; }

    .mono {
      font-family: 'JetBrains Mono', ui-monospace, monospace;
      font-size: 0.82rem; background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px; padding: 2px 7px; color: #fde68a;
      word-break: break-all;
    }

    .stat-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 10px; margin: 14px 0 18px;
    }
    .stat {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px; padding: 12px 14px;
    }
    .stat .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-dim); font-weight: 700; }
    .stat .v { margin-top: 4px; font-size: 1.05rem; font-weight: 800; color: var(--accent-yellow); }
    .stat .s { margin-top: 4px; font-size: 0.8rem; color: var(--text-muted); line-height: 1.4; }

    .divider {
      height: 1px; margin: 22px 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.12), transparent);
    }

    .footer-note {
      margin-top: 22px; padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.75rem; color: var(--text-dim); line-height: 1.5;
      opacity: 0.72;
    }
    .footer-note .quiet-wink {
      opacity: 0.65;
      font-style: italic;
      color: #64748b;
    }

    .help-fab {
      position: fixed; bottom: 18px; right: 20px; z-index: 100;
      width: 42px; height: 42px; padding: 0;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(18, 22, 29, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      color: var(--accent-yellow); font-family: inherit;
      font-size: 1.15rem; font-weight: 800; border-radius: 50%;
      cursor: pointer; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }
    .help-fab:hover {
      transform: translateY(-2px);
      border-color: rgba(225, 29, 72, 0.45);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.5), 0 0 20px rgba(225, 29, 72, 0.2);
    }

    .modal-backdrop {
      position: fixed; inset: 0; z-index: 800;
      background: rgba(0, 0, 0, 0.72);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; align-items: center; justify-content: center;
      padding: 16px; opacity: 0; pointer-events: none;
      transition: opacity 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
    }
    .modal-backdrop.open { opacity: 1; pointer-events: auto; }
    .modal-window {
      background: rgba(18, 22, 29, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px; width: 100%; max-width: 420px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 30px rgba(225, 29, 72, 0.1);
      transform: scale(0.92) translateY(12px);
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }
    .modal-backdrop.open .modal-window { transform: scale(1) translateY(0); }
    .modal-header {
      padding: 16px 20px; border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex; align-items: center; justify-content: space-between;
    }
    .modal-title {
      font-size: 1.05rem; font-weight: 800; color: var(--text-main);
    }
    .modal-close-btn {
      background: rgba(255, 255, 255, 0.08); border: none; color: var(--text-muted);
      width: 30px; height: 30px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; font-size: 1.2rem; font-weight: bold; line-height: 1;
      transition: all 0.2s ease;
    }
    .modal-close-btn:hover { background: rgba(255, 255, 255, 0.18); color: #fff; }
    .modal-body {
      padding: 20px; display: flex; flex-direction: column; gap: 18px;
    }
    .modal-body p {
      color: var(--text-muted); font-size: 0.98rem; line-height: 1.6; margin: 0;
    }
    .modal-go-btn {
      align-self: flex-start;
      display: inline-flex; align-items: center; justify-content: center;
      font-family: inherit; font-size: 0.9rem; font-weight: 700;
      padding: 11px 22px; border-radius: 999px; text-decoration: none;
      background: linear-gradient(135deg, rgba(225, 29, 72, 0.95), rgba(220, 38, 38, 0.9));
      color: #111827; border: 1px solid rgba(225, 29, 72, 0.55);
      box-shadow: 0 8px 24px rgba(220, 38, 38, 0.25);
      transition: transform 0.2s ease, filter 0.2s ease;
    }
    .modal-go-btn:hover { transform: translateY(-1px); filter: brightness(1.05); }

    @media (max-width: 560px) {
      body { padding: 0.8rem 0.65rem 2.5rem; }
      .card { padding: 20px 16px 24px; border-radius: 24px; }
      .tab-btn { flex: 1 1 100%; }
      .help-fab { bottom: 14px; right: 14px; width: 38px; height: 38px; font-size: 1.05rem; }
    }
  </style>
</head>
<body>
  <div class="background-container" aria-hidden="true">
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>
    <div class="glow-orb orb-3"></div>

  </div>

  <div class="page-wrap">
    <div class="topbar">
      <a class="back-link" href="./" id="backLink"><span>←</span> <span id="backText">Back to duck</span></a>

        <a class="btn-primary" id="ipaBtn" href="https://github.com/Nanda070/Neptun-ELTE/releases" target="_blank" rel="noopener noreferrer"></a>

        <button type="button" class="tab-btn" data-tab="macos" role="tab" aria-selected="false" id="tabMacos">macOS</button>

  <script>
    const i18n = {
      en: {
        back: "Back to duck",
        about: "About me",
        heroBadge: "Unofficial · ELTE only",
        titleHtml: 'Download <span>NEPTUN Mobile</span> for ELTE',
        lede: "Detailed install & usage guide for the unofficial ELTE Neptun mobile client by Nanda. Same visual style as this site — pick your platform below anytime.",
        ipaBtn: "IPA / Releases (GitHub)",
        githubBtn: "Open GitHub repo",
        ipaNotice: "<strong>IPA download:</strong> no <span class=\"mono\">.ipa</span> is hosted on this site yet (planned path later: <span class=\"mono\">/downloads/neptun-elte.ipa</span>). Use <a class=\"inline\" href=\"https://github.com/Nanda070/Neptun-ELTE/releases\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Releases</a> when Nanda publishes a build, or ask Nanda. App bug reports / ideas: <a class=\"inline\" href=\"https://github.com/Nanda070/Neptun-ELTE/issues/new\" target=\"_blank\" rel=\"noopener noreferrer\">GitHub Issues</a>. General contact: <a class=\"inline\" href=\"https://nanda.is-a.dev\" target=\"_blank\" rel=\"noopener noreferrer\">nanda.is-a.dev</a>. Do not trust random third-party IPA mirrors.",
        statOwnerS: "Independent project · not affiliated with ELTE IT / Neptun vendor",
        statAndroidS: "Rough feature-parity with the intended client surface (core workflows + GitHub APK updater/CI). Not Play Store–ready. Live ELTE login still depends on portal / Student web health.",
        statIosS: "No App Store / TestFlight. Use Sideloadly or AltStore with your own Apple ID.",
        statLicenseS: "Source on GitHub · LGPL-3.0-only",
        tabWindows: "Windows",
        tabMacos: "macOS",
        tabPhone: "Phone only",
        windows: `
          <h2>Install via Windows (Sideloadly + your Apple ID)</h2>
          <p>Best path if you have a Windows PC and an iPhone. You sign the IPA with <strong>your own free Apple ID</strong> — no paid Apple Developer account required for personal sideloading (7-day resign cycle on free accounts).</p>
          <h3>What you need</h3>
          <ul>
            <li>Windows PC + USB cable (or Wi-Fi after first pair, if Sideloadly supports it for your setup)</li>
            <li><a class="inline" href="https://sideloadly.io/" target="_blank" rel="noopener noreferrer">Sideloadly</a> + iTunes / Apple Devices drivers as Sideloadly docs require</li>
            <li>Your Apple ID (used only to sign the app on your device)</li>
            <li>The <span class="mono">.ipa</span> from <a class="inline" href="https://github.com/Nanda070/Neptun-ELTE/releases" target="_blank" rel="noopener noreferrer">GitHub Releases</a> (when available) or from Nanda</li>
          </ul>
          <h3>Steps</h3>
          <ol>
            <li>Install Sideloadly on Windows; trust / allow drivers if prompted.</li>
            <li>Unlock the iPhone, connect USB, tap <strong>Trust</strong> this computer.</li>
            <li>Open Sideloadly → drag the IPA in → enter your Apple ID → Start.</li>
            <li>On the iPhone: <strong>Settings → General → VPN &amp; Device Management</strong> → trust the developer profile for your Apple ID.</li>
            <li>Launch <strong>Neptun ELTE</strong>. Prefer a <strong>release</strong> IPA — on iOS 14+, debug builds often will not open from the home-screen icon.</li>
            <li><strong>Free Apple ID note:</strong> apps typically expire after ~7 days. Re-sideload (or use a tool that auto-refreshes) to keep using it. Paid Developer Program lasts longer (~1 year).</li>
          </ol>
          <h3>Honesty</h3>
          <ul>
            <li>This is <strong>not</strong> an App Store install. Apple may show “Untrusted Developer” until you trust the profile.</li>
            <li>Never enter your Apple ID password on unknown websites — only in Sideloadly / Apple’s own prompts.</li>
          </ul>
          <h3>Developer Mode (iOS 16+)</h3>
          <p>After installing via Sideloadly/AltStore and trusting the developer profile, newer iPhones often need <strong>Developer Mode</strong> before the app will launch.</p>

      try { localStorage.setItem('quack_lang', lang); } catch (_) {}
      document.documentElement.lang = lang;
      const d = i18n[lang];

        btn.setAttribute('aria-pressed', on ? 'true' : 'false');

      document.getElementById('helpModalClose').setAttribute('aria-label', d.helpClose);
      document.title = lang === 'ru'
        ? 'Скачать NEPTUN Mobile for ELTE'
        : lang === 'hu'
          ? 'NEPTUN Mobile for ELTE letöltése'
          : 'Download NEPTUN Mobile for ELTE';
    }

    const helpModal = document.getElementById('helpModal');
    const helpFab = document.getElementById('helpFab');

    function openHelpModal() {

      document.getElementById('helpModalClose').focus();
    }
    function closeHelpModal() {
      helpModal.classList.remove('open');
      helpFab.focus();
    }

    helpFab.addEventListener('click', openHelpModal);
    document.getElementById('helpModalClose').addEventListener('click', closeHelpModal);
    helpModal.addEventListener('click', (e) => {
      if (e.target === helpModal) closeHelpModal();
    });
    helpModal.querySelector('.modal-window').addEventListener('click', (e) => e.stopPropagation());
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && helpModal.classList.contains('open')) closeHelpModal();
    });

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => {

          b.setAttribute('aria-selected', b === btn ? 'true' : 'false');
        });

        });
      });
    });

    const fromQuery = params.get('lang');
    let fromStore = null;
