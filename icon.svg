<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="128" fill="#131722"/>
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffc72c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffc72c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bodyGrad" x1="120" y1="120" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF36D"/>
      <stop offset="45%" stop-color="#FFCA28"/>
      <stop offset="100%" stop-color="#F57F17"/>
    </linearGradient>
    <linearGradient id="beakGrad" x1="40" y1="160" x2="200" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9E40"/>
      <stop offset="60%" stop-color="#FF6D00"/>
      <stop offset="100%" stop-color="#DD2C00"/>
    </linearGradient>
  </defs>
  <circle cx="256" cy="256" r="220" fill="url(#glow)"/>
  <!-- Body -->
  <path d="M190 240 C190 190 230 170 280 170 C360 170 420 220 420 300 C420 370 360 410 280 410 C190 410 140 350 140 300 C140 280 160 256 190 240 Z" fill="url(#bodyGrad)"/>
