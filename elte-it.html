    let currentLang = 'en';
    let activeFilter = 'all';

    function bindCopyButtons(root, d) {
      root.querySelectorAll('.copy').forEach(btn => {
        btn.textContent = d.copy;
        btn.addEventListener('click', async () => {
          try {
            await navigator.clipboard.writeText(btn.dataset.copy);
            const old = d.copy;
            btn.textContent = d.copied;
            btn.classList.add('ok');
            setTimeout(() => { btn.textContent = old; btn.classList.remove('ok'); }, 1200);
          } catch {
            btn.textContent = d.copyFail;
            setTimeout(() => { btn.textContent = d.copy; }, 1200);
          }
        });
      });
    }

    function renderTable() {
      const d = i18n[currentLang];
      const q = document.getElementById('search').value.trim().toLowerCase();
      const body = document.getElementById('servicesBody');
      body.innerHTML = '';
      let visible = 0;

      services.forEach(s => {
        const t = s.i18n[currentLang];
        const tagLabel = t.tagLabel || s.tagLabel;
        const matchCat = activeFilter === 'all' || s.cat === activeFilter;
        const hay = (s.search + ' ' + t.name + ' ' + (t.user || '') + ' ' + t.pass + ' ' + (t.portal || '')).toLowerCase();
        const matchText = !q || hay.includes(q);
        if (!matchCat || !matchText) return;
        visible++;

        const tagHtml = s.tag
          ? ` <span class="tag ${s.tag}">${tagLabel}</span>`
          : '';
        const userCell = s.userHtml || t.user || '';
        const portalCell = s.portalHtml || (t.portal || '');

        const tr = document.createElement('tr');
        tr.dataset.cat = s.cat;
        tr.innerHTML =
          `<td>${t.name}${tagHtml}</td>` +
          `<td>${userCell}</td>` +
          `<td>${t.pass}</td>` +
          `<td>${portalCell}</td>`;
        body.appendChild(tr);
      });

      document.getElementById('count').textContent = d.count(visible);
      document.getElementById('empty').style.display = visible ? 'none' : 'block';
      document.getElementById('empty').textContent = d.empty;
      bindCopyButtons(body, d);
    }

    function applyLang(lang) {
      if (!i18n[lang]) return;
      currentLang = lang;
      try { localStorage.setItem('quack_lang', lang); } catch (_) {}
      document.documentElement.lang = lang;
      const d = i18n[lang];

      document.querySelectorAll('.lang-btn').forEach(btn => {
        const on = btn.dataset.lang === lang;
        btn.classList.toggle('active', on);
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
      });

      document.getElementById('backText').textContent = d.back;
      document.getElementById('aboutLinkText').textContent = d.about;
      document.getElementById('aboutLink').href = './about.html?lang=' + lang;
      document.getElementById('heroBadge').textContent = d.heroBadge;
      document.getElementById('pageTitle').innerHTML = d.titleHtml;
      document.getElementById('pageLede').textContent = d.lede;
      document.getElementById('neptunLink').textContent = d.neptunLink;
      document.getElementById('neptunLink').href = './neptun-elte.html?lang=' + lang;
      document.getElementById('securityNote').innerHTML = d.securityNote;
      document.getElementById('search').placeholder = d.searchPlaceholder;
      document.getElementById('fAll').textContent = d.fAll;
      document.getElementById('fIig').textContent = d.fIig;
      document.getElementById('fNeptun').textContent = d.fNeptun;
      document.getElementById('fInf').textContent = d.fInf;
      document.getElementById('fLib').textContent = d.fLib;
      document.getElementById('fOther').textContent = d.fOther;
      document.getElementById('thService').textContent = d.thService;
      document.getElementById('thUser').textContent = d.thUser;
      document.getElementById('thPass').textContent = d.thPass;
      document.getElementById('thPortal').textContent = d.thPortal;
      document.getElementById('updatedLabel').innerHTML = d.updated;
      document.getElementById('footerNote').textContent = d.footer;
      document.title = d.title;
      document.getElementById('backLink').href = './?lang=' + lang;

      renderTable();
    }

    document.querySelectorAll('.lang-btn').forEach(btn => {
      btn.addEventListener('click', () => applyLang(btn.dataset.lang));
    });

    document.querySelectorAll('.filter').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        activeFilter = btn.dataset.filter;
        renderTable();
      });
    });

    document.getElementById('search').addEventListener('input', renderTable);

    const params = new URLSearchParams(location.search);
    const fromQuery = params.get('lang');
    let fromStore = null;
    try { fromStore = localStorage.getItem('quack_lang'); } catch (_) {}
    applyLang(['ru', 'en', 'hu'].includes(fromQuery) ? fromQuery : (['ru', 'en', 'hu'].includes(fromStore) ? fromStore : 'en'));
  </script>
